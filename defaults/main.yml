---
# defaults file for role-ssh
# SSH package name
ssh_package_name: openssh-server
ssh_restart_handler_state: restarted
ssh_package_dependencies:
  - figlet
ssh_custom_banner_path: "/etc/ssh"
ssh_custom_banner_file_name: "banner"
ssh_custom_banner_org_text: "asaplab"
ssh_validate_command: "sshd -T %s"

ssh_user_root:
  - name: root
    home_dir: "/"
    manage_ssh_key: true
    ssh_key_type: rsa
    ssh_key_size: 2048
    private_key: ""
    public_key: ""
    authorized_keys:
      - key: "{{ lookup('file', lookup('env', 'HOME') + '/.ssh/id_rsa.pub') }}"
        state: present

# SSH users setup
ssh_user_users:
  []

# SSH secure configuration
ssh_secure_config: false

# SSH secure config custom if true
# SSH hardening configs
ssh_port: 22
ssh_max_auth_tries: 3
ssh_login_grace_time: 30
ssh_password_authentication: "no"
ssh_pubkey_authentication: "yes"
ssh_permit_root_login: "yes"
ssh_allow_users: []
ssh_allow_group_users: []
ssh_usedns: "no"
ssh_permit_empty_password: "no"
ssh_challenge_response_auth: "no"
ssh_gss_api_authentication: "no"
ssh_x11_forwarding: "no"
ssh_allow_tcp_forwarding: "no"
ssh_allow_agent_forwarding: "no"
ssh_permit_tunnel: "no"
ssh_permit_user_env: "no"
ssh_client_alive_interval: 300
ssh_client_alive_count_max: 3
