---
# vars file for role-ssh
ssh_key_types:
  - rsa
  - dsa
  - ecdsa
  - ed25519

__ssh_user_root_default:
  - name: root
    home_dir: "/"
    ssh_key_type: rsa
    manage_ssh_key: yes

ssh_user_root_setup:
  [
    "{{ __ssh_user_root_default | combine(ssh_user_root, list_merge='append_rp') }}",
  ]

# SSH hardening settings
__ssh_secure_config_default:
  - key: "Protocol"
    value: 2
  - key: "PermitRootLogin"
    value: "yes"
  - key: "PasswordAuthentication"
    value: "no"
  - key: "Port"
    value: 22
  - key: "MaxAuthTries"
    value: 2
  - key: "LoginGraceTime"
    value: 30
  - key: "UseDNS"
    value: "no"
  - key: "PermitEmptyPasswords"
    value: "no"
  - key: "ChallengeResponseAuthentication"
    value: "no"
  - key: "KerberosAuthentication"
    value: "no"
  - key: "GSSAPIAuthentication"
    value: "no"
  - key: "X11Forwarding"
    value: "no"
  - key: "AllowAgentForwarding"
    value: "no"
  - key: "AllowTcpForwarding"
    value: "no"
  - key: "PermitTunnel"
    value: "no"
  - key: "PermitUserEnvironment"
    value: "no"
  - key: "ClientAliveInterval"
    value: 300
  - key: "ClientAliveCountMax"
    value: 3
  - key: "MaxStartUps"
    value: "5:30:10"
  - key: "MaxSessions"
    value: 5
  - key: "AllowUsers"
    value: []
  - key: "AllowGroups"
    value: []

ssh_secure_configs: "{{ [__ssh_secure_config_default, ssh_secure_config_custom] | community.general.lists_mergeby('key') }}"
