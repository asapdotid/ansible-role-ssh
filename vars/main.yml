---
# vars file for role-ssh
ssh_key_types:
  - rsa
  - dsa
  - ecdsa
  - ed25519

__ssh_user_root_default:
  - name: root
    home_dir: "/"
    ssh_key_type: rsa
    manage_ssh_key: true

ssh_user_root_setup:
  [
    "{{ __ssh_user_root_default | combine(ssh_user_root, list_merge='append_rp') }}",
  ]

